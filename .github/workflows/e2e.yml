name: End-to-end recycle

# Separate from test.yml on purpose: this job moves real files through the
# Recycle Bin and restores them. A hosted runner that cannot recycle should not
# turn every pull request red, so the job is scheduled and manual only.
# continue-on-error is provisional until a hosted run has passed; remove it then.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: read

jobs:
  round-trip:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recycle and restore a throwaway directory
        run: python disk-cleanup/scripts/e2e_check.py --drive C:
