name: End-to-end recycle
on:
  # push is deliberate: workflows that arrive with only schedule/dispatch
  # sometimes never register with the trigger system (dispatch answers 422 and
  # the workflow shows its path as its name) until they have actually run once.
  # continue-on-error below keeps this from blocking anyone.
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: read

jobs:
  round-trip:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recycle and restore a throwaway directory
        run: python disk-cleanup/scripts/e2e_check.py --drive C:
