name: Validate scanner
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s disk-cleanup/tests -v
      - name: Coverage of the modules that carry the safety contract
        run: |
          python -m pip install coverage
          python -m coverage run -m unittest discover -s disk-cleanup/tests
          python -m coverage report
