name: Probe O drive quoted
on: [push]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python disk-cleanup/scripts/e2e_check.py --drive "C:"
